# /etc/samba/smb.conf — CM5 NAS, tuned for macOS clients
# Data disk mounted at /srv/nas (ext4). Users: add with `sudo smbpasswd -a <user>`.
# @LAN_CIDR@ is filled in by scripts/setup-nas.sh (auto-detected, or LAN_CIDR=...).

[global]
   workgroup = WORKGROUP
   server string = CM5 NAS
   netbios name = nas
   server role = standalone server
   map to guest = never
   security = user

   # Listen on loopback, wired LAN and Tailscale only. eth0 also carries a public
   # IPv6 address: hosts allow + the ufw rules from setup-nas.sh keep it closed.
   interfaces = lo eth0 tailscale0
   bind interfaces only = yes
   hosts allow = 127.0.0.1 ::1 @LAN_CIDR@ 100.64.0.0/10 fd7a:115c:a1e0::/48
   hosts deny = ALL

   # SMB3 only (macOS uses SMB3 by default)
   server min protocol = SMB3
   smb encrypt = desired

   # mDNS: Samba registers _smb._tcp and _adisk._tcp (Time Machine) with Avahi
   multicast dns register = yes
   fruit:model = MacSamba

   # macOS compatibility (vfs_fruit). Must be set globally so all shares agree.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:zero_file_id = yes
   ea support = yes

   # Performance
   use sendfile = yes
   aio read size = 1
   aio write size = 1

   # Logging
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

   # No printers
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[Share]
   path = /srv/nas/share
   valid users = @nas
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 2775
   force group = nas

[Media]
   path = /srv/nas/media
   valid users = @nas
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 2775
   force group = nas

[TimeMachine]
   path = /srv/nas/timemachine/%U
   valid users = @nas
   read only = no
   browseable = yes
   fruit:time machine = yes
   fruit:time machine max size = 3000G
   create mask = 0600
   directory mask = 0700
