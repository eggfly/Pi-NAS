# /etc/samba/smb.conf — CM5 NAS, tuned for macOS clients
# Global settings only: scripts/setup-disks.sh fills in @LAN_CIDR@ (auto-detected, or LAN_CIDR=...)
# and appends one share per physical disk (/srv/<label>). Users: add with `sudo smbpasswd -a <user>`.

[global]
   workgroup = WORKGROUP
   server string = CM5 NAS
   netbios name = nas
   server role = standalone server
   map to guest = never
   security = user

   # Listen on all addresses: access is limited by "hosts allow" below and by the ufw rules from
   # setup-nas.sh. (Not "bind interfaces only": at boot smbd can start before DHCP assigns IPv4.)
   hosts allow = 127.0.0.1 ::1 @LAN_CIDR@ 100.64.0.0/10 fd7a:115c:a1e0::/48
   hosts deny = ALL

   # SMB3 only (macOS uses SMB3 by default)
   server min protocol = SMB3
   smb encrypt = desired

   # mDNS: Samba registers _smb._tcp with Avahi (no Time Machine share, so no _adisk._tcp)
   multicast dns register = yes
   fruit:model = MacSamba

   # macOS compatibility (vfs_fruit). Must be set globally so all shares agree.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:zero_file_id = yes
   ea support = yes

   # Performance
   use sendfile = yes
   aio read size = 1
   aio write size = 1

   # Logging
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

   # No printers
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
